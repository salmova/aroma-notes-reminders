name: Monthly content plan reminder

on:
  schedule:
    # 10:00 Moscow (UTC+3) = 07:00 UTC
    - cron: '0 7 29 * *'   # 29th of every month (skipped in February — no day 29 in non-leap years)
    - cron: '0 7 28 2 *'   # 28th of February (covers non-leap years; script de-dupes in leap years)
  workflow_dispatch: {}    # manual trigger for testing

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_reminder.py
